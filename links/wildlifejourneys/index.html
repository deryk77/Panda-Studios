<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>Wildlife Journeys Africa — Links | East Africa Safari</title>
  <meta name="description" content="Explore East Africa with Wildlife Journeys Africa. Find our website, social profiles, and contact links.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.pandastudios.co/links/wildlifejourneys">

  <!-- NO Google Fonts — custom fonts only -->

  <style>

    /* ────────────────────────────────────────────────────────────────
       FONTS  — root-absolute paths, real filenames confirmed above
    ──────────────────────────────────────────────────────────────── */
    @font-face {
      font-family: 'New Spirit';
      src: url('/links/wildlifejourneys/New%20Spirit%20Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'New Spirit';
      src: url('/links/wildlifejourneys/New%20Spirit%20SemiBold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'New Spirit';
      src: url('/links/wildlifejourneys/New%20Spirit%20Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    /* ────────────────────────────────────────────────────────────────
       RESET
    ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    /* ────────────────────────────────────────────────────────────────
       BODY — transparent so the fixed background div shows through
    ──────────────────────────────────────────────────────────────── */
    body {
      background: transparent;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'New Spirit', Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
      color: #1A2A14;
    }

    /* ────────────────────────────────────────────────────────────────
       BACKGROUND — fixed, behind everything
       Root-absolute URL: /links/wildlifejourneys/WLJ BG-19.png
       (URL-encoded space: %20)
    ──────────────────────────────────────────────────────────────── */
    .wj-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #E8DCC4;                               /* fallback */
      background-image: url('/links/wildlifejourneys/WLJ%20BG-19.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
    }

    /* ────────────────────────────────────────────────────────────────
       MAIN CONTENT — above background
    ──────────────────────────────────────────────────────────────── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 520px;
      padding: 56px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ────────────────────────────────────────────────────────────────
       PROFILE BLOCK
    ──────────────────────────────────────────────────────────────── */
    .wj-profile {
      text-align: center;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(16px);
      animation: wj-rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    /* Logo — root-absolute: /links/wildlifejourneys/WLJ Logo.png */
    .wj-profile__logo {
      width: 220px;
      height: auto;
      display: block;
      margin: 0 auto 22px;
    }

    .wj-tagline {
      font-family: 'New Spirit', Georgia, serif;
      font-weight: 400;         /* New Spirit Regular */
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(26, 42, 20, 0.72);
      letter-spacing: 0.01em;
      max-width: 320px;
      margin: 0 auto;
    }

    /* ────────────────────────────────────────────────────────────────
       LINKS STACK
    ──────────────────────────────────────────────────────────────── */
    .wj-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* ────────────────────────────────────────────────────────────────
       LIQUID GLASS BUTTON
       ~50 % transparent — background image shows through clearly
    ──────────────────────────────────────────────────────────────── */
    .wj-link {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 0 22px;
      border-radius: 100px;
      text-decoration: none;
      font-family: 'New Spirit', Georgia, serif;
      font-weight: 600;         /* New Spirit SemiBold */
      font-size: 1.02rem;
      letter-spacing: 0.03em;
      color: #1A2A14;
      cursor: pointer;

      /* cream-to-gold gradient — exactly 50 % transparent */
      background: linear-gradient(
        150deg,
        rgba(240, 220, 160, 0.50) 0%,
        rgba(200, 165, 80,  0.50) 50%,
        rgba(175, 140, 55,  0.50) 100%
      );

      /* frosted glass */
      backdrop-filter: blur(24px) saturate(1.8) brightness(1.05);
      -webkit-backdrop-filter: blur(24px) saturate(1.8) brightness(1.05);

      border: 1px solid rgba(215, 185, 100, 0.45);
      box-shadow:
        0 4px 22px rgba(100, 72, 16, 0.09),
        inset 0 1.5px 0 rgba(255, 248, 200, 0.65),
        inset 0 -1px 0  rgba(80, 54, 8,   0.10);

      transition:
        background    0.22s ease,
        border-color  0.22s ease,
        box-shadow    0.22s ease,
        transform     0.12s ease;

      /* entrance animation start-state */
      opacity: 0;
      transform: translateY(14px);
    }

    .wj-link.wj-visible {
      animation: wj-rise 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .wj-link:hover,
    .wj-link:focus-visible {
      background: linear-gradient(
        150deg,
        rgba(230, 200, 120, 0.68) 0%,
        rgba(190, 150, 55,  0.52) 50%,
        rgba(165, 125, 38,  0.62) 100%
      );
      border-color: rgba(205, 168, 72, 0.68);
      box-shadow:
        0 6px 28px rgba(100, 72, 16, 0.16),
        inset 0 1.5px 0 rgba(255, 250, 210, 0.80),
        inset 0 -1px 0  rgba(80, 54, 8,   0.16);
      outline: none;
    }

    .wj-link:active {
      transform: scale(0.975);
      transition-duration: 0.06s;
    }

    /* Icon — left side, warm amber to complement brand gold */
    .wj-link__icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      margin-right: 14px;
      color: #7A5418;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* stroke-based icons */
    .wj-link__icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* fill-based social logos */
    .wj-link__icon svg.wj-fill {
      fill: currentColor;
      stroke: none;
    }

    /* Label — centred optically (padding-right balances the icon) */
    .wj-link__label {
      flex: 1;
      text-align: center;
      padding-right: 22px;
    }

    /* ────────────────────────────────────────────────────────────────
       KEYFRAMES
    ──────────────────────────────────────────────────────────────── */
    @keyframes wj-rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ────────────────────────────────────────────────────────────────
       MOBILE  ≤ 540 px
    ──────────────────────────────────────────────────────────────── */
    @media (max-width: 540px) {
      main               { padding: 50px 20px 52px; }
      .wj-profile        { margin-bottom: 40px; }
      .wj-profile__logo  { width: 190px; }
      .wj-tagline        { font-size: 0.93rem; }
      .wj-links          { gap: 11px; }
      .wj-link           { min-height: 58px; font-size: 0.97rem; }
    }

  </style>

</head>

<body>

  <!--
    BACKGROUND DIV — fixed, z-index 0, body is transparent.
    Image: /links/wildlifejourneys/WLJ BG-19.png  (confirmed filename)
  -->
  <div class="wj-bg" aria-hidden="true"></div>

  <main>

    <!--
      LOGO — /links/wildlifejourneys/WLJ Logo.png  (confirmed filename)
    -->
    <div class="wj-profile">
      <img
        src="/links/wildlifejourneys/WLJ%20Logo.png"
        alt="Wildlife Journeys Africa"
        class="wj-profile__logo"
        width="220"
      >
      <p class="wj-tagline">Private gorilla trekking &amp; luxury safaris.<br>Rwanda &nbsp;·&nbsp; Uganda.</p>
    </div>

    <div class="wj-links" id="wjLinksStack" role="list"></div>

  </main>

  <script>

      mail: `<svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m2 7 10 7 10-7"/>
      </svg>`,

      whatsapp: `<svg class="wj-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
      </svg>`,

      instagram: `<svg class="wj-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
      </svg>`,

      facebook: `<svg class="wj-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>`,

      linkedin: `<svg class="wj-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>`,

      x: `<svg class="wj-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>`,
    };

    /* ── Links config ────────────────────────────────────────────── */
    const LINKS = [
      { label: 'Our Website',  url: 'https://wildlife-journeys.com/',                                icon: 'globe'     },
      { label: 'Instagram',    url: 'https://www.instagram.com/wildlifejourneysafrica',              icon: 'instagram' },
      { label: 'Facebook',     url: 'https://www.facebook.com/profile.php?id=61590299253377',        icon: 'facebook'  },
      { label: 'X / Twitter',  url: 'https://x.com/journeys_africa',                                icon: 'x'         },
      { label: 'LinkedIn',     url: 'https://www.linkedin.com/company/wildlifejourneys-africa/',     icon: 'linkedin'  },
      { label: 'WhatsApp',     url: 'https://wa.me/250795301492',                                    icon: 'whatsapp'  },
      { label: 'Call Us',      url: 'tel:+250795301492',                                             icon: 'phone'     },
      { label: 'Email Us',     url: 'mailto:info@wildlife-journeys.com',                             icon: 'mail'      },
    ];

    const stack = document.getElementById('wjLinksStack');

    LINKS.forEach(({ label, url, icon }, i) => {
      const a = document.createElement('a');
      a.href = url;
      a.className = 'wj-link';
      a.setAttribute('role', 'listitem');

      if (url.startsWith('http')) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }

      a.innerHTML = `
        <span class="wj-link__icon">${ICONS[icon] || ''}</span>
        <span class="wj-link__label">${label}</span>
      `;

      a.style.animationDelay = `${0.22 + i * 0.07}s`;
      stack.appendChild(a);
      requestAnimationFrame(() => a.classList.add('wj-visible'));
    });
  </script>

  <script>
    (function () {
      const url = new URL(location.href);
      const tracking = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid','msclkid','mc_eid','ref'];
      let cleaned = false;
      tracking.forEach(function (p) { if (url.searchParams.has(p)) { url.searchParams.delete(p); cleaned = true; } });
      if (cleaned) history.replaceState(null, '', url.pathname + (url.searchParams.toString() ? '?' + url.searchParams : '') + url.hash);
    })();
  </script>
