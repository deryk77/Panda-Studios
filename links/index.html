  <style>
    @font-face {

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:              #FF0000;
      --black:            #000000;
      --white:            #ffffff;
      --white-soft:       rgba(255, 255, 255, 0.65);
    }

    html, body {
      height: 100%;
    }

    .ps-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('/links/BG.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
    }

    body {
      background: transparent;
      color: var(--white);
      font-family: 'New Spirit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      position: relative;
      z-index: 1;
    }

    /* ── Main content ────────────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 46px 20px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Profile block ───────────────────────────────────────────────── */
    .ps-profile {
      text-align: center;
      margin-bottom: 36px;
      opacity: 0;
      transform: translateY(18px);
      animation: ps-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
    }

    .ps-profile__logo {
      height: 45px;
      width: auto;
      display: block;
      margin: 0 auto 19px;
    }

    .ps-profile__name {
      font-family: 'New Spirit', sans-serif;
      font-weight: 400;
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      letter-spacing: 0.05em;
      color: var(--white);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .ps-profile__tagline {
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      color: var(--white-soft);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    /* ── Links stack ─────────────────────────────────────────────────── */
    .ps-links {
      width: 100%;
      max-width: 389px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    /* ── Glass buttons ───────────────────────────────────────────── */
    .ps-link {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 58px;
      padding: 0 20px;

      background: rgba(255, 255, 255, .06);
      -webkit-backdrop-filter: url(#glass) blur(3px) saturate(150%) brightness(1.12);
      backdrop-filter:         url(#glass) blur(3px) saturate(150%) brightness(1.12);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 40px;
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, .55),
        inset 0 -8px 14px  rgba(0, 0, 0, .35),
        inset 0 0   22px   rgba(255, 255, 255, .04),
        0 10px 30px        rgba(0, 0, 0, .45);

      text-decoration: none;
      color: var(--white);
      font-family: 'New Spirit', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      transition:
        background   0.22s ease,
        box-shadow   0.22s ease,
        transform    0.15s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      /* entrance state */
      opacity: 0;
      transform: translateY(14px);
    }

    /* Fresnel rim — gradient border via padding + mask-composite exclude */
    .ps-link::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      padding: 1px;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, .45),
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, .05));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    /* Icons and text sit above the rim layer */
    .ps-link__icon,
    .ps-link__label,
    .ps-link__chevron {
      position: relative;
      z-index: 1;
    }

    .ps-link.ps-visible {
      animation: ps-rise 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .ps-link:hover,
    .ps-link:focus-visible {
      background: rgba(255, 255, 255, .09);
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, .70),
        inset 0 -8px 14px  rgba(0, 0, 0, .30),
        inset 0 0   22px   rgba(255, 255, 255, .05),
        0 14px 36px        rgba(0, 0, 0, .50);
      transform: translateY(-2px);
      outline: none;
    }

    .ps-link:active {
      transform: translateY(0) scale(0.988);
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, .40),
        inset 0 -6px 10px  rgba(0, 0, 0, .40),
        0 4px 12px         rgba(0, 0, 0, .45);
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }

    .ps-link__icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-right: 14px;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* stroke-based icons */
    .ps-link__icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      overflow: visible;
    }

    /* fill-based social logos */
    .ps-link__icon svg.ps-fill {
      fill: currentColor;
      stroke: none;
    }

    .ps-link__label {
      flex: 1;
      text-align: center;
      /* padding-right balances the icon+margin (20px + 14px) so text is optically centred */
      padding-right: 34px;
    }

    .ps-link__chevron {
      flex-shrink: 0;
      margin-left: 12px;
      color: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
    }

    .ps-link__chevron svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* ── Mobile overrides (≤ 540px) ─────────────────────────────────── */
    @media (max-width: 540px) {
      main                  { padding: 49px 24px 52px; }
      .ps-profile           { margin-bottom: 44px; }
      .ps-profile__logo     { height: 45px; width: auto; margin-bottom: 21px; }
      .ps-profile__name     { font-size: clamp(1.45rem, 5.5vw, 1.85rem); margin-bottom: 10px; }
      .ps-profile__tagline  { font-size: 0.95rem; }
      .ps-links             { gap: 14px; }
      .ps-link              { min-height: 64px; padding: 0 22px; font-size: 1.02rem; }
      /* Keep blur lighter on mobile for performance */
      .ps-link {
        -webkit-backdrop-filter: blur(10px) saturate(150%) brightness(1.06);
        backdrop-filter: url(#ps-glass) blur(10px) saturate(150%) brightness(1.06);
      }
    }

    /* ── Keyframes ───────────────────────────────────────────────────── */
    @keyframes ps-rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

</head>

<body>
  <!--

  <svg width="0" height="0" style="position:absolute">

    <!-- Links — rendered by JS below -->

  </main>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // LINKS CONFIG — edit this array to add, remove, or reorder links.
    // Each entry: { label, url, icon }
    // icon keys: globe | audit | mail | phone | whatsapp | linkedin | x | instagram | substack
    // ─────────────────────────────────────────────────────────────────────────

      { label: 'Our Website',                            url: 'https://www.pandastudios.co/',                  icon: 'globe'     },
      { label: 'Hospitality & Tourism Audit',              url: 'https://www.pandastudios.co/brand-audit',       icon: 'audit'     },
      { label: 'Call Us',                                url: 'tel:+256772233050',                              icon: 'phone'     },
      { label: 'WhatsApp',                               url: 'https://whatsform.com/T8aqVV',                   icon: 'whatsapp'  },
      { label: 'X / Twitter',                            url: 'https://x.com/PandaStudios77',                  icon: 'x'         },
      { label: 'Instagram',                              url: 'https://www.instagram.com/pandastudios77/',      icon: 'instagram' },
      { label: 'LinkedIn',                               url: 'https://ug.linkedin.com/company/pandastudios77', icon: 'linkedin'  },
    ];

    // ─────────────────────────────────────────────────────────────────────────
    // ICONS — inline SVGs, no CDN, no library
    // Stroke-based: globe, audit, mail, phone, link
    // Fill-based (.ps-fill class): social logos
    // ─────────────────────────────────────────────────────────────────────────
    const ICONS = {
      globe: `<svg viewBox="0 0 24 24" aria-hidden="true">

      </svg>`,

      audit: `<svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>`,

      mail: `<svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m2 7 10 7 10-7"/>
      </svg>`,

      phone: `<svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>`,

      link: `<svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>`,

      whatsapp: `<svg class="ps-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
      </svg>`,

      linkedin: `<svg class="ps-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>`,

      x: `<svg class="ps-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>`,

      instagram: `<svg class="ps-fill" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>

        <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/>

    const CHEVRON = `<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>`;

    // ─────────────────────────────────────────────────────────────────────────
    // Render links
    // ─────────────────────────────────────────────────────────────────────────
    const stack = document.getElementById('psLinksStack');

    LINKS.forEach(({ label, url, icon }, i) => {
      const a = document.createElement('a');
      a.href = url;
      a.className = 'ps-link';
      a.setAttribute('role', 'listitem');

      // all web links open in a new tab — keeps the links page itself open
      if (url.startsWith('http')) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }

      a.innerHTML = `
        <span class="ps-link__icon">${ICONS[icon] || ICONS.link}</span>
        <span class="ps-link__label">${label}</span>
        <span class="ps-link__chevron">${CHEVRON}</span>
      `;

      // staggered entrance — delay increases with index
      a.style.animationDelay = `${0.18 + i * 0.07}s`;
      stack.appendChild(a);

      // add class on next frame so CSS delay actually fires
      requestAnimationFrame(() => a.classList.add('ps-visible'));
    });

  </script>
